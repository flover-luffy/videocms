# ============================================================
# VideoCMS 生产部署 docker-compose 配置
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: videocms_app
    ports:
      - "3001:3000"
      - "3010:3010"  # 一起看 WebSocket 端口
    volumes:
      - backups:/app/backups
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Container-to-container addresses must use compose service names.
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?connection_limit=20&pool_timeout=15
      - REDIS_URL=redis://redis:6379/0
      - NEXT_TELEMETRY_DISABLED=1
    command: ["sh", "-c", "npx prisma migrate deploy && node server.js"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  db:
    image: postgres:15-alpine
    container_name: videocms_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - TZ=Asia/Shanghai
    env_file:
      - .env
    ports:
      - "127.0.0.1:54321:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: videocms_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
  backups:
